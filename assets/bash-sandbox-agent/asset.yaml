apiVersion: asset.sap/v1
kind: Asset
type: agent

metadata:
  name: bash-sandbox-agent
  version: "1.0.0"

agentCard:
  name: Bash Sandbox Agent
  version: "1.0.0"
  description: >
    An AI agent that connects to external MCP servers and exposes a full suite of
    local bash tools (shell, Python execution, file I/O, Git, build/test) inside
    a sandboxed environment. Combines data from both sources in a single reasoning turn.

provides:
  apis:
    - name: bash-sandbox-agent
      kind: a2a
      ordId: customer.build:apiResource:bash-sandbox-agent-f984c.bash-sandbox-agent:v1

container:
  buildPath: .
  port: 5000

probes:
  startup:
    path: /.well-known/agent.json
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 18
  liveness:
    path: /.well-known/agent.json
    initialDelaySeconds: 15
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
  readiness:
    path: /.well-known/agent.json
    initialDelaySeconds: 5
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 3
